<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Create Account — LUXE MARKET</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css"/>
</head>
<body data-page="account">

<div class="app-shell">
  <div id="sidebar-mount"></div>
  <div class="main-area" id="main-area">
    <div id="topbar-mount"></div>

    <main class="content">
      <div class="auth-wrap">
        <div class="eyebrow" style="justify-content:center;">Join Us</div>
        <h2 style="text-align:center;">Create Your Account</h2>
        <form id="registerForm">
          <div class="field"><label>Full Name</label><input id="regName" required/></div>
          <div class="field"><label>Email Address</label><input type="email" id="regEmail" required/></div>
          <div class="field"><label>Password</label><input type="password" id="regPassword" minlength="6" required/></div>
          <div class="field"><label>Confirm Password</label><input type="password" id="regPassword2" minlength="6" required/></div>
          <label style="display:flex;gap:.5rem;font-size:.8rem;align-items:flex-start;margin-bottom:1rem;">
            <input type="checkbox" required style="margin-top:.2rem;"/> I agree to the Terms &amp; Conditions and Privacy Policy.
          </label>
          <div id="regError" style="color:var(--rose);font-size:.8rem;margin-bottom:.6rem;"></div>
          <button class="btn btn-gold btn-block" type="submit">Create Account</button>
        </form>
        <div class="or-divider">or continue with</div>
        <div class="social-auth-row">
          <button id="googleRegBtn">🔵 Google</button>
          <button id="fbRegBtn">🔷 Facebook</button>
        </div>
        <p style="text-align:center;margin-top:1.2rem;font-size:.85rem;">Already have an account? <a href="login.html" style="color:var(--gold-dim);font-weight:700;">Login</a></p>
      </div>
    </main>
    <div id="footer-mount"></div>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/cart.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/auth.js"></script>
<script src="js/layout.js"></script>
<script>
document.getElementById("registerForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const errEl = document.getElementById("regError");
  errEl.textContent = "";
  const p1 = document.getElementById("regPassword").value, p2 = document.getElementById("regPassword2").value;
  if (p1 !== p2) { errEl.textContent = "Passwords do not match."; return; }
  try {
    await LuxeAuth.register(document.getElementById("regName").value, document.getElementById("regEmail").value, p1);
    Toast.show("Account created! Welcome to LUXE MARKET.");
    window.location.href = "account.html";
  } catch (err) { errEl.textContent = err.message; }
});
document.getElementById("googleRegBtn").addEventListener("click", async () => { await LuxeAuth.loginWithGoogle(); window.location.href = "account.html"; });
document.getElementById("fbRegBtn").addEventListener("click", () => Toast.show("Facebook login requires Firebase Facebook provider setup."));
</script>
</body>
</html>
