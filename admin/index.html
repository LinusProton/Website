<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Dashboard — LUXE Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css"/>
</head>
<body data-page="dashboard">
<div class="app-shell">
  <div id="sidebar-mount"></div>
  <div class="main-area" id="main-area">
    <div id="topbar-mount"></div>
    <main class="content">
      <div class="grid grid-4" id="kpiGrid" style="margin-bottom:1.6rem;"></div>

      <div class="grid" style="grid-template-columns:2fr 1fr;gap:1.4rem;align-items:start;">
        <div class="admin-card">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;">
            <h4 style="margin:0;">Revenue — Last 7 Days</h4>
          </div>
          <svg id="revenueChart" viewBox="0 0 600 220" style="width:100%;height:220px;"></svg>
        </div>
        <div class="admin-card">
          <h4 style="margin-top:0;">Inventory Alerts</h4>
          <div id="lowStockList"></div>
        </div>
      </div>

      <div class="grid" style="grid-template-columns:1.4fr 1fr;gap:1.4rem;align-items:start;margin-top:1.4rem;">
        <div class="admin-card">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:.8rem;">
            <h4 style="margin:0;">Recent Orders</h4>
            <a href="orders.html" class="link-more">Manage all →</a>
          </div>
          <table class="admin-table" id="recentOrdersTable"></table>
        </div>
        <div class="admin-card">
          <h4 style="margin-top:0;">Best-Selling Products</h4>
          <div id="bestSellerList"></div>
        </div>
      </div>

      <div class="admin-card" style="margin-top:1.4rem;">
        <h4 style="margin-top:0;">Pending Deliveries</h4>
        <table class="admin-table" id="pendingDeliveryTable"></table>
      </div>
    </main>
  </div>
</div>
<script src="../js/data.js"></script>
<script src="../js/cart.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>
<script src="../js/firebase-config.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/layout.js"></script>
<script src="../js/admin-layout.js"></script>
<script src="../js/admin.js"></script>
<script src="../js/admin-dashboard.js"></script>
</body>
</html>
