<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Reset Password — LUXE MARKET</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css"/>
</head>
<body data-page="account">
<div class="app-shell">
  <div id="sidebar-mount"></div>
  <div class="main-area" id="main-area">
    <div id="topbar-mount"></div>
    <main class="content">
      <div class="auth-wrap">
        <div class="eyebrow" style="justify-content:center;">Account Recovery</div>
        <h2 style="text-align:center;">Reset Your Password</h2>
        <p style="text-align:center;">Enter your email and we'll send you a link to reset your password.</p>
        <form id="resetForm">
          <div class="field"><label>Email Address</label><input type="email" id="resetEmail" required/></div>
          <button class="btn btn-gold btn-block" type="submit">Send Reset Link</button>
        </form>
        <p style="text-align:center;margin-top:1.2rem;font-size:.85rem;"><a href="login.html" style="color:var(--gold-dim);font-weight:700;">← Back to Login</a></p>
      </div>
    </main>
    <div id="footer-mount"></div>
  </div>
</div>
<script src="js/data.js"></script>
<script src="js/cart.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/auth.js"></script>
<script src="js/layout.js"></script>
<script>
document.getElementById("resetForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  await LuxeAuth.resetPassword(document.getElementById("resetEmail").value);
  Toast.show("If an account exists, a reset link has been sent.");
});
</script>
</body>
</html>
